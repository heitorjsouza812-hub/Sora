# Catálogo de modelos conhecidos (especificação §5, "Catálogo de modelos").
# Conferido em 2026-10-11. Mantido pela equipe e revisto todo mês (preços mudam).
# Lido por app/seletor/catalogo.py.
#
# - nivel: N1 | N2 | N3 | especial. É uma PROPOSTA até o modelo passar no "Teste dos modelos" (§5).
# - preco_entrada / preco_saida: US$ por 1 milhão de tokens, na faixa padrão de contexto.
#   null = sob consulta ou vem do mapa de custos do LiteLLM (litellm.model_cost); 0 = grátis.
# - contexto: null = o catálogo usa litellm.model_cost; só preenchido onde a especificação diz.
# - capacidades: ferramentas | json | visao | imagem | embeddings. PROPOSTA inicial, não vem da
#   especificação: conferir no teste e no mapa do LiteLLM antes de confiar.
# - confirmar_nome: true = a especificação manda confirmar o nome na API do provedor.
# - provedor: origem do modelo. xai, deepseek, zai e mistral não têm tipo próprio em
#   `tipo_provedor`: chegam via OpenRouter ou API compatível com a da OpenAI.
# - Modelo fora do catálogo entra como N2 e sem capacidades confirmadas (§5).

versao: 1
conferido_em: 2026-10-11

