[project]
name = "sora-backend"
version = "0.1.0"
description = "Backend assíncrono da plataforma Sora."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.16,<2",
    "argon2-cffi>=25.1,<26",
    "arq>=0.26,<1",
    "asyncpg>=0.30,<1",
    "cryptography>=45,<47",
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "langchain==1.4.6",
    "langchain-core==1.6.10",
    "langchain-litellm==0.11.1",
    "langgraph==1.2.15",
    "langgraph-checkpoint-postgres==3.1.3",
    "litellm>=1.79,<2",
    "openpyxl>=3.1,<4",
    "pillow>=11,<13",
    "psycopg[binary,pool]>=3.2,<4",
    "pwdlib[argon2]>=0.3,<1",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "pyjwt>=2.10,<3",
    "pypdf>=6,<7",
    "python-docx>=1.2,<2",
    "python-multipart>=0.0.20,<1",
    "pyyaml>=6,<7",
    "redis[hiredis]>=5,<6",
    "sentry-sdk[fastapi]>=2.39,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "sse-starlette>=3,<4",
    "trafilatura>=2,<3",
    "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.13,<1",
    "testcontainers[postgres,redis]>=4.13,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
