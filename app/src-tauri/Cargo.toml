[package]
name = "sora"
version = "0.1.0"
description = "Sora — sua ideia, seus agentes, tudo em uma conversa"
authors = ["Sora"]
edition = "2024"
rust-version = "1.90"

[lib]
name = "sora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2.6"
tauri-plugin-updater = "2"


# Leitura do estado real das janelas (primeiro plano/minimizada) para a ilha só fora do app.
# C3 (controle do PC por bot, src/pc/): captura GDI, UI Automation, SendInput, borda nativa.
[target.'cfg(windows)'.dependencies]
base64 = "0.22"
png = "0.18"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Registry",
  "Win32_System_LibraryLoader",
  "Win32_System_Ole",
  "Win32_System_Threading",
  "Win32_Storage_Packaging_Appx",
  "Win32_System_Variant",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
