<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
"use strict";
const W = 1920, H = 1080, DURATION = 75;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const layer = document.createElement('canvas'); layer.width = W; layer.height = H;
const lx = layer.getContext('2d');
const FONT = '"Inter","Segoe UI",system-ui,sans-serif';

// ---------- utilidades ----------
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => { t = clamp(t); return t * t * (3 - 2 * t); };
const eio = t => { t = clamp(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const eout = t => { t = clamp(t); return 1 - Math.pow(1 - t, 3); };
const eback = t => { t = clamp(t); const c = 1.6; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const prog = (t, a, b) => clamp((t - a) / (b - a));
const win = (t, a, b, fi = .5, fo = .5) => Math.min(smooth((t - a) / fi), smooth((b - t) / fo));
const mixc = (c1, c2, t) => [lerp(c1[0], c2[0], t), lerp(c1[1], c2[1], t), lerp(c1[2], c2[2], t)];
const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const pulseAt = (t, at, w = 0.15) => Math.exp(-Math.pow((t - at) / w, 2));
function rand(i) { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
function rrect(c, x, y, w, h, r) { c.beginPath(); c.roundRect(x, y, w, h, r); }
function trapInt(t, a, b, c, d) {
  if (t <= a) return 0;
  let s = 0;
  const up = Math.min(t, b) - a; s += up * up / (2 * (b - a));
  if (t <= b) return s;
  s += Math.min(t, c) - b;
  if (t <= c) return s;
  const x = Math.min(t, d) - c, L = d - c;
  return s + x - x * x / (2 * L);
}

// ---------- paleta e agentes ----------
const WHITE = [226, 236, 255];
const AG = [
  { name: 'Atlas', role: 'Pesquisa e referências', col: [86, 168, 255], hex: '#56a8ff', type: 0, verb: 'Pesquisando', wait: 'Aguardando', tools: ['Perplexity', 'Google Drive', 'Notion'] },
  { name: 'Luna', role: 'Criação visual', col: [172, 128, 255], hex: '#ac80ff', type: 1, verb: 'Criando', wait: 'Aguardando referências', tools: ['Higgsfield', 'Figma', 'Canva'] },
  { name: 'Nina', role: 'Textos e planejamento', col: [70, 232, 168], hex: '#46e8a8', type: 2, verb: 'Escrevendo', wait: 'Aguardando peças', tools: ['Notion', 'Google Agenda', 'Instagram'] },
];
const BG = '#050608', PANEL = '#0f1115', PANEL2 = '#14161b', LINE = 'rgba(255,255,255,0.08)';

// ---------- linha do tempo ----------
const VS = window.VOICE || { start: 61, dur: 2.8, fps: 30, levels: [] };
const T = {
  form: [0.3, 2.8], eyesOpen: 2.55,
  zoom: [4.6, 6.4],
  typeA: 7.6, typeB: 13.0, send: 13.6,
  replyDots: 14.4, reply: 15.2,
  plan: 18.2, tabs: [19.0, 19.7, 20.4], msg2: 21.4,
  work: [[21.8, 33.2], [33.8, 37.6], [38.2, 41.4]],
  shrink: [55.0, 56.6], phoneIn: [55.6, 57.2], deskOut: [59.4, 60.4],
  tap: 60.6, voice: VS.start, voiceEnd: VS.start + VS.dur,
  vSend: VS.start + VS.dur + 0.3, vReply: VS.start + VS.dur + 2.0,
  outro: [68.0, 69.0], toCenter: [68.2, 69.6], agentsIn: 69.3, name: 70.4, phrase: 71.2, cta: 72.0,
};
const VIEWS = [['greet', 0], ['sora', 13.7], ['atlas', 29.0], ['luna', 33.6], ['nina', 38.0], ['sora2', 41.7], ['plugins', 45.4]];
const REQ = 'Crie uma campanha para lançar minha cafeteria: pesquise referências, prepare as peças e monte um calendário de posts.';
const CAPTIONS = [
  [6.6, 13.5, 'Descreva o que você precisa.'],
  [14.0, 18.2, 'A Sora entende o pedido e organiza o trabalho.'],
  [19.0, 28.8, 'Você define o objetivo. Sora coordena os agentes.'],
  [29.2, 33.5, 'Atlas pesquisa e organiza as referências.'],
  [33.8, 37.9, 'Luna cria as peças da campanha.'],
  [38.2, 41.6, 'Nina escreve as legendas e monta o calendário.'],
  [41.9, 45.2, 'Acompanhe cada etapa e revise antes de publicar.'],
  [45.8, 54.8, 'Higgsfield, Figma, ChatGPT, Gemini e muito mais.'],
];

// ---------- estados dos agentes ----------
const agentWork = (k, t) => win(t, T.work[k][0], T.work[k][1], 0.6, 0.4);
const agentProg = (k, t) => prog(t, T.work[k][0], T.work[k][1]);
function agentStatus(k, t) {
  if (t < T.work[k][0]) return { txt: AG[k].wait, st: 0 };
  if (t < T.work[k][1]) return { txt: AG[k].verb, st: 1 };
  return { txt: 'Concluído', st: 2 };
}

// ---------- personagem (duas cascas de pontos: capuz + tigela) ----------
function norm3(x, y, z) { const l = Math.hypot(x, y, z); return [x / l, y / l, z / l]; }
function cross3(a, b) { return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]]; }
function makeShell(axis, phMax, rad, bright) {
  const A = norm3(...axis), E1 = norm3(...cross3(A, [0, 0, 1])), E2 = cross3(A, E1);
  return { A, E1, E2, phMax, rad, bright };
}
const SHELLS = [
  makeShell([0.4, -0.6, -0.69], Math.acos(-0.5), 1.03, 1.0),   // capuz
  makeShell([-0.15, 0.8, -0.58], Math.acos(-0.25), 1.0, 0.92),  // tigela
];
function buildGrid(spec) {
  const pts = [];
  spec.forEach(([m, k], sh) => {
    for (let j = 0; j < k; j++) for (let i = 0; i < m; i++)
      pts.push({ sh, th: i / m * Math.PI * 2, ph: lerp(0.3, SHELLS[sh].phMax, j / (k - 1)) });
  });
  return pts;
}
const GRID_MAIN = buildGrid([[60, 44], [60, 40]]);
const GRID_L = buildGrid([[40, 21], [40, 21]]), GRID_M = buildGrid([[28, 14], [28, 13]]), GRID_S = buildGrid([[18, 8], [18, 8]]);
const N = GRID_MAIN.length;
const P = GRID_MAIN.map((g, i) => ({ ...g, r2: rand(i + 999), q: rand(i + 55),
  sx: (rand(i + 77) - .5) * W * 1.3 + W / 2, sy: (rand(i + 177) - .5) * H * 1.4 + H / 2, sz: rand(i + 277) }));

function bodyPoint(sh, th, ph, B, t, idx) {
  const S = SHELLS[sh];
  let r = 1 + 0.014 * Math.sin(t * 1.8 + (B.seed || 0));
  r *= 1 + (B.listen || 0) * 0.055 * Math.sin(ph * 7 - t * 9);
  const work = B.work || 0;
  let thv = th + B.rot * (sh ? -0.8 : 1);
  if (B.type === 1) thv += work * 0.9 * Math.sin(ph * 2.2 + t * 3.2);
  if (B.type === 2) r *= 1 + work * 0.07 * Math.sin(th * 5 + t * 6) * Math.sin(ph);
  if (B.type === 0) r *= 1 + work * 0.03 * Math.sin(ph * 12 + t * 14);
  r += work * 0.018 * Math.sin(idx * 12.9898 + t * 9);
  r += (B.pulse || 0) * (0.05 + 0.025 * Math.sin(ph * 6 - t * 18));
  const cp = Math.cos(ph), sp = Math.sin(ph), ct = Math.cos(thv), st = Math.sin(thv);
  const dx = cp * S.A[0] + sp * (ct * S.E1[0] + st * S.E2[0]);
  const dy = cp * S.A[1] + sp * (ct * S.E1[1] + st * S.E2[1]);
  const dz = cp * S.A[2] + sp * (ct * S.E1[2] + st * S.E2[2]);
  const rr = r * S.rad;
  const x = dx * rr * 1.05, yy = dy * rr * 0.96, z2 = dz * rr;
  const top = clamp(0.5 - yy * 0.6 + x * 0.15 + z2 * 0.3);
  const front = smooth((dz + 0.06) / 0.22);
  let b = (0.14 + 0.95 * top) * S.bright;
  b += 0.35 * front * Math.exp(-Math.pow((S.phMax - ph) / 0.12, 2));
  const s = lerp(0.72, 1.6, top) * lerp(0.7, 1, front);
  let a = lerp(0.05, 1, front);
  if (sh === 1 && dx * SHELLS[0].A[0] + dy * SHELLS[0].A[1] + dz * SHELLS[0].A[2] > Math.cos(SHELLS[0].phMax) + 0.02) a *= 0.18;
  if (B.type === 0 && work > 0) b += work * 0.9 * Math.exp(-Math.pow((yy - Math.sin(t * 2.6) * 0.9) / 0.09, 2));
  b += work * 0.5 * Math.max(0, Math.sin(idx * 7.13 + t * 11)) ** 12;
  const persp = 1 + z2 * 0.12;
  return { x: B.cx + x * B.R * persp, y: B.cy + yy * B.R * persp, z: z2, b, a, s };
}

// fila de personagens (desenhados na camada com brilho) e de olhos
let BODIES = [], EYES = [], CLIPDEV = null;
function setClipDev(y0, y1) { const m = ctx.getTransform(); CLIPDEV = [m.transformPoint(new DOMPoint(0, y0)).y, m.transformPoint(new DOMPoint(0, y1)).y]; }
function qBody(B) {
  const m = ctx.getTransform(), p = m.transformPoint(new DOMPoint(B.cx, B.cy));
  let alpha = ctx.globalAlpha * (B.alpha == null ? 1 : B.alpha);
  if (CLIPDEV) alpha *= smooth((p.y - CLIPDEV[0]) / 12) * smooth((CLIPDEV[1] - p.y) / 12);
  if (alpha < 0.01) return;
  const MB = { ...B, cx: p.x, cy: p.y, R: B.R * m.a, alpha };
  BODIES.push(MB);
  EYES.push(MB);
}
function drawBodyDots(B, t) {
  const g = B.R > 55 ? GRID_L : B.R > 22 ? GRID_M : GRID_S;
  const col = B.col || WHITE;
  for (let i = 0; i < g.length; i++) {
    const q = bodyPoint(g[i].sh, g[i].th, g[i].ph, B, t, i);
    const a = q.a * B.alpha;
    if (a < 0.01) continue;
    const bb = clamp(q.b, 0, 1.6);
    lx.fillStyle = `rgba(${Math.min(255, col[0] * bb) | 0},${Math.min(255, col[1] * bb) | 0},${Math.min(255, col[2] * bb) | 0},${a.toFixed(3)})`;
    lx.beginPath(); lx.arc(q.x, q.y, Math.max(0.55, 1.6 * B.R / 150 * q.s * (B.R < 60 ? 1.45 : 1)), 0, 7); lx.fill();
  }
}
function drawEyes(B, t) {
  const vis = (B.eyes == null ? 1 : B.eyes) * (B.alpha == null ? 1 : B.alpha);
  if (vis <= 0.01) return;
  let blink = 1;
  for (const bt of (B.blinks || [])) { const q = Math.abs(t - bt); if (q < 0.12) blink = Math.min(blink, q / 0.12); }
  const R = B.R, col = B.col || WHITE;
  const w = 0.05 * R, h = 0.125 * R * clamp(B.eyes == null ? 1 : B.eyes) * Math.max(0.08, blink);
  const ox = -0.25 * R + (B.lookX || 0) * R * 0.09, oy = 0.02 * R + (B.lookY || 0) * R * 0.06;
  const c = mixc(col, [236, 244, 255], 0.6);
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = clamp(vis);
  ctx.shadowColor = rgba(col, 0.75); ctx.shadowBlur = Math.max(2, R * 0.16);
  ctx.fillStyle = rgba(c, 1);
  for (const s of [-1, 1]) { ctx.beginPath(); ctx.ellipse(B.cx + s * 0.125 * R + ox, B.cy + oy, Math.max(0.6, w), Math.max(0.4, h), 0, 0, 7); ctx.fill(); }
  ctx.restore();
}
function floorGlow(cx, cy, R, col, alpha) {
  if (alpha <= 0) return;
  ctx.save(); ctx.translate(cx, cy + R * 1.18); ctx.scale(1, 0.13);
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, R * 1.1);
  g.addColorStop(0, rgba(col, 0.35 * alpha)); g.addColorStop(1, rgba(col, 0));
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, R * 1.1, 0, 7); ctx.fill(); ctx.restore();
}

// ---------- câmera do computador e do celular ----------
function desk(t) {
  const u = eio(prog(t, ...T.zoom));
  let s = lerp(1.12, 1, u), ox = 0, oy = 0, a = u;
  const v = eio(prog(t, ...T.shrink));
  s *= lerp(1, 0.5, v); ox = lerp(0, -390, v); oy = lerp(0, 10, v);
  const w = eio(prog(t, ...T.deskOut));
  a *= 1 - w; ox -= 140 * w;
  return { s, ox, oy, a };
}
const dmap = (D, x, y) => [960 + (x - 960) * D.s + D.ox, 540 + (y - 540) * D.s + D.oy];
const setDesk = D => ctx.setTransform(D.s, 0, 0, D.s, 960 * (1 - D.s) + D.ox, 540 * (1 - D.s) + D.oy);
const phoneX = t => (1 - eout(prog(t, ...T.phoneIn))) * 760;
const phoneA = t => eout(prog(t, ...T.phoneIn)) * (1 - eio(prog(t, ...T.outro)));

// ---------- Sora (personagem principal, partículas) ----------
function mainState(t) {
  const D = desk(t);
  let p = { cx: 960, cy: 450, R: 230 };
  const go = (tg, a, b) => { const u = eio(prog(t, a, b)); p = { cx: lerp(p.cx, tg[0], u), cy: lerp(p.cy, tg[1], u), R: lerp(p.R, tg[2], u) }; };
  const g = dmap(D, 1110, 330); go([g[0], g[1], 80 * D.s], ...T.zoom);
  const sb = dmap(D, 106, 299); go([sb[0], sb[1], 15 * D.s], 13.9, 14.8);
  go([1286 + phoneX(t), 196, 15], 59.2, 60.2);
  go([960, 300, 150], ...T.toCenter);
  const listen = win(t, T.typeA - 0.2, T.send + 0.3, 0.4, 0.4) * 0.7;
  let pulse = pulseAt(t, T.send + 0.25) * 0.8 + pulseAt(t, T.reply) * 0.5;
  for (const tb of T.tabs) pulse = Math.max(pulse, pulseAt(t, tb + 0.1, 0.12) * 0.6);
  for (const w of T.work) pulse = Math.max(pulse, pulseAt(t, w[1] + 0.1, 0.12) * 0.6);
  pulse = Math.max(pulse, pulseAt(t, T.vReply, 0.15) * 0.6);
  const lookX = -0.75 * win(t, 2.7, 3.6, 0.25, 0.35) + 0.5 * win(t, 71.0, 72.2, 0.3, 0.4);
  const lookY = win(t, T.typeA - 0.3, T.send, 0.4, 0.4) * 0.9;
  const rot = t * 0.28 + 1.0 * trapInt(t, 4.6, 5.0, 6.0, 6.4) + 1.0 * trapInt(t, 13.9, 14.2, 14.5, 14.8) + 1.2 * trapInt(t, 68.2, 68.6, 69.2, 69.6);
  return { ...p, rot, listen, pulse, work: 0, type: -1, seed: 0, lookX, lookY, col: WHITE };
}
function drawMainParticles(t, M) {
  const formIn = prog(t, ...T.form);
  const globalA = smooth(prog(t, 0, 0.8));
  const density = clamp(Math.pow(M.R / 100, 1.5), 0.1, 1);
  const sizeK = 1.75 * M.R / 230 * (M.R < 100 ? lerp(2.2, 1, clamp((M.R - 16) / 84)) : 1);
  for (let i = 0; i < N; i++) {
    const p = P[i];
    const dA = smooth((density - p.q) / 0.05 + 0.5);
    if (dA <= 0.01) continue;
    const q = bodyPoint(p.sh, p.th, p.ph, M, t, i);
    let { x, y, b, a } = q, size = sizeK * q.s;
    const fp = eio(formIn * 1.6 - p.r2 * 0.6);
    if (fp < 1) {
      x = lerp(p.sx, x, fp); y = lerp(p.sy, y, fp);
      a *= lerp(0.25 + p.sz * 0.6, 1, fp); b = lerp(0.5 + p.sz * 0.5, b, fp); size *= lerp(0.6 + p.sz, 1, fp);
    }
    a *= globalA * dA;
    if (a < 0.01) continue;
    const bb = clamp(b, 0, 1.6);
    lx.fillStyle = `rgba(${Math.min(255, WHITE[0] * bb) | 0},${Math.min(255, WHITE[1] * bb) | 0},${Math.min(255, WHITE[2] * bb) | 0},${a.toFixed(3)})`;
    lx.beginPath(); lx.arc(x, y, Math.max(0.55, size), 0, 7); lx.fill();
  }
}

// ---------- texto ----------
function text(str, x, y, { size = 40, weight = 400, color = '#fff', align = 'left', alpha = 1, ls = 0 } = {}) {
  if (alpha <= 0.002) return 0;
  ctx.save();
  ctx.globalAlpha = Math.min(ctx.globalAlpha, clamp(alpha));
  ctx.font = `${weight} ${size}px ${FONT}`; ctx.letterSpacing = ls + 'px';
  ctx.textAlign = align; ctx.textBaseline = 'alphabetic'; ctx.fillStyle = color;
  ctx.fillText(str, x, y);
  const w = ctx.measureText(str).width; ctx.restore(); return w;
}
function measure(str, size, weight, ls = 0) {
  ctx.save(); ctx.font = `${weight} ${size}px ${FONT}`; ctx.letterSpacing = ls + 'px';
  const w = ctx.measureText(str).width; ctx.restore(); return w;
}
function wrap(str, maxW, size, weight) {
  const words = str.split(' '), lines = []; let cur = '';
  for (const w of words) { const tt = cur ? cur + ' ' + w : w; if (measure(tt, size, weight) > maxW && cur) { lines.push(cur); cur = w; } else cur = tt; }
  if (cur) lines.push(cur); return lines;
}
function shimmerText(str, x, y, size, weight, t, alpha = 1) {
  const w = measure(str, size, weight);
  const bx = x - 120 + ((t * 0.8) % 1) * (w + 240);
  const g = ctx.createLinearGradient(bx - 90, 0, bx + 90, 0);
  g.addColorStop(0, '#5f6672'); g.addColorStop(0.5, '#f1f4f9'); g.addColorStop(1, '#5f6672');
  return text(str, x, y, { size, weight, color: g, alpha });
}
function gradText(str, x, y, size, weight, alpha, align = 'left', c1 = '#ffffff', c2 = '#9cc4ff') {
  const w = measure(str, size, weight), x0 = align === 'center' ? x - w / 2 : x;
  const g = ctx.createLinearGradient(x0, 0, x0 + w, 0); g.addColorStop(0, c1); g.addColorStop(1, c2);
  text(str, x, y, { size, weight, color: g, align, alpha });
}

// ---------- BorderBeam (colorful, md, strength 0.7) ----------
function perimeterPoint(x, y, w, h, r, u) {
  const sw = w - 2 * r, sh = h - 2 * r, arc = Math.PI * r / 2;
  const segs = [sw, arc, sh, arc, sw, arc, sh, arc], total = 2 * sw + 2 * sh + 4 * arc;
  let d = ((u % 1) + 1) % 1 * total;
  for (let i = 0; i < 8; i++) {
    if (d <= segs[i] || i === 7) {
      const k = segs[i] ? d / segs[i] : 0;
      switch (i) {
        case 0: return [x + r + sw * k, y];
        case 1: { const a = -Math.PI / 2 + k * Math.PI / 2; return [x + w - r + r * Math.cos(a), y + r + r * Math.sin(a)]; }
        case 2: return [x + w, y + r + sh * k];
        case 3: { const a = k * Math.PI / 2; return [x + w - r + r * Math.cos(a), y + h - r + r * Math.sin(a)]; }
        case 4: return [x + w - r - sw * k, y + h];
        case 5: { const a = Math.PI / 2 + k * Math.PI / 2; return [x + r + r * Math.cos(a), y + h - r + r * Math.sin(a)]; }
        case 6: return [x, y + h - r - sh * k];
        case 7: { const a = Math.PI + k * Math.PI / 2; return [x + r + r * Math.cos(a), y + r + r * Math.sin(a)]; }
      }
    }
    d -= segs[i];
  }
}
const BEAM_COLORS = [[255, 214, 245], [255, 92, 205], [168, 104, 255], [80, 140, 255], [60, 224, 210]];
function beamColor(k) {
  const f = clamp(k) * (BEAM_COLORS.length - 1), i = Math.min(BEAM_COLORS.length - 2, Math.floor(f));
  return mixc(BEAM_COLORS[i], BEAM_COLORS[i + 1], f - i);
}
function borderBeam(x, y, w, h, r, t, { strength = 0.7, period = 3.2, length = 0.36, alpha = 1 } = {}) {
  if (alpha <= 0.01) return;
  const head = t / period, n = 90;
  ctx.save(); ctx.globalAlpha *= alpha; ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'butt';
  for (const off of [0, 0.5]) {
    let prev = perimeterPoint(x, y, w, h, r, head + off);
    for (let i = 1; i <= n; i++) {
      const k = i / n, pt = perimeterPoint(x, y, w, h, r, head + off - k * length);
      const c = beamColor(k), fade = Math.pow(1 - k, 0.9) * (off ? 0.6 : 1), rgb = `${c[0] | 0},${c[1] | 0},${c[2] | 0}`;
      ctx.strokeStyle = `rgba(${rgb},${0.4 * strength * fade})`; ctx.lineWidth = 12;
      ctx.beginPath(); ctx.moveTo(prev[0], prev[1]); ctx.lineTo(pt[0], pt[1]); ctx.stroke();

const VOICE_COLS = [[255, 92, 205], [168, 104, 255], [80, 140, 255], [60, 224, 210], [255, 170, 90]];
function voiceLevel(t) {
  const f = (t - VS.start) * VS.fps;
  if (f < 0 || f >= VS.levels.length - 1) return 0;
  const i = Math.floor(f), u = f - i;
  return lerp(VS.levels[i], VS.levels[i + 1], u);
}
function voiceBeam(x, y, w, h, t, { level = 0, processing = 0, alpha = 1 } = {}) {
  if (alpha <= 0.01) return;

  ctx.save(); ctx.globalAlpha *= alpha; ctx.globalCompositeOperation = 'lighter';
  const v = 1 - processing;
  if (v > 0.01) {
    VOICE_COLS.forEach((c, i) => {
      const cx = x + w / 2 + (i - 2) * w * 0.14 + Math.sin(t * 1.7 + i * 2.1) * w * 0.02;
      const hg = 10 + level * 90 * (0.55 + 0.45 * Math.sin(t * 6.3 + i * 1.9));
      const wd = w * 0.17 * (0.8 + 0.6 * level);
      ctx.save(); ctx.translate(cx, base); ctx.scale(wd / hg, 1);
      const g = ctx.createRadialGradient(0, 0, 0, 0, 0, hg);
      g.addColorStop(0, rgba(c, 0.6 * v * (0.35 + 0.65 * level))); g.addColorStop(1, rgba(c, 0));
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, hg, 0, 7); ctx.fill(); ctx.restore();
    });

    const g2 = ctx.createLinearGradient(x + w / 2 - lw / 2, 0, x + w / 2 + lw / 2, 0);
    g2.addColorStop(0, 'rgba(255,255,255,0)'); g2.addColorStop(0.5, `rgba(255,255,255,${0.8 * v * (0.3 + 0.7 * level)})`); g2.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g2; ctx.fillRect(x + w / 2 - lw / 2, base - 1.5, lw, 3);
  }
  if (processing > 0.01) {
    const u = 0.5 + 0.5 * Math.sin(t * 2.6), px = x + 26 + u * (w - 52);
    VOICE_COLS.slice(0, 4).forEach((c, j) => {
      const g = ctx.createRadialGradient(px + (j - 1.5) * 16, base, 0, px + (j - 1.5) * 16, base, 46);
      g.addColorStop(0, rgba(c, 0.55 * processing)); g.addColorStop(1, rgba(c, 0));
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(px + (j - 1.5) * 16, base, 46, 0, 7); ctx.fill();
    });
    const g3 = ctx.createLinearGradient(px - 110, 0, px + 110, 0);
    g3.addColorStop(0, 'rgba(255,255,255,0)'); g3.addColorStop(0.5, `rgba(255,255,255,${0.9 * processing})`); g3.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g3; ctx.fillRect(px - 110, base - 1.5, 220, 3);
  }
  ctx.restore();
}

    if (t > T.tap) { ctx.strokeStyle = `rgba(255,255,255,${(1 - q) * 0.7})`; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(1530, 829, 22 + q * 28, 0, 7); ctx.stroke(); }
  }
  ctx.fillStyle = 'rgba(255,255,255,0.5)'; rrect(ctx, 1360, 872, 100, 5, 3); ctx.fill();
  ctx.restore();
  ctx.restore();
}

// ---------- textos de cena ----------
function sceneTexts(t) {
  // cena 1
  const a1 = win(t, 2.0, 5.4, 0.7, 0.6), a2 = win(t, 2.6, 5.4, 0.7, 0.6);
  const s1 = 'Uma ideia.', s2 = 'Uma equipe pronta para agir.';
  const w1 = measure(s1, 56, 300), w2 = measure(s2, 56, 300), x0 = 960 - (w1 + 18 + w2) / 2;
  text(s1, x0, 860 + (1 - eout(prog(t, 2.0, 2.8))) * 20, { size: 56, weight: 300, color: '#f2f5fb', alpha: a1 });
  gradText(s2, x0 + w1 + 18, 860 + (1 - eout(prog(t, 2.6, 3.4))) * 20, 56, 300, a2, 'left', '#ffffff', '#9cc4ff');
  // legendas sob a janela
  for (const [a, b, s] of CAPTIONS) {
    const al = win(t, a, b, 0.5, 0.4) * (1 - eio(prog(t, ...T.shrink)));
    if (al <= 0) continue;
    text(s, 960, 1000 + (1 - eout(prog(t, a, a + 0.6))) * 10, { size: 30, weight: 400, color: '#eef2fa', align: 'center', alpha: al });
  }
  // cena 6
  const ya = lerp(210, 470, eio(prog(t, ...T.deskOut)));
  const p1 = win(t, 56.2, 68.2, 0.7, 0.6), p2 = win(t, 57.0, 68.2, 0.7, 0.6);
  text('Acesse de qualquer lugar.', 130, ya + (1 - eout(prog(t, 56.2, 57.0))) * 20, { size: 60, weight: 300, color: '#f2f5fb', alpha: p1 });
  gradText('No computador ou no celular.', 130, ya + 76 + (1 - eout(prog(t, 57.0, 57.8))) * 20, 60, 300, p2, 'left', '#e6eeff', '#8fbcff');
  const p3 = win(t, 61.0, 68.2, 0.6, 0.6) * eio(prog(t, ...T.deskOut));
  text('Fale com a Sora pelo celular:', 130, ya + 170, { size: 26, weight: 400, color: '#8b93a3', alpha: p3 });
  text('os mesmos agentes, a mesma campanha.', 130, ya + 206, { size: 26, weight: 400, color: '#8b93a3', alpha: p3 });
  // cena 7
  const na = eout(prog(t, T.name, T.name + 0.8));
  if (na > 0) {
    const g = ctx.createLinearGradient(820, 0, 1100, 0); g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#a9c9ff');
    text('Sora', 960, 800 + (1 - na) * 16, { size: 110, weight: 500, color: g, align: 'center', alpha: na, ls: lerp(10, -1, na) });
  }
  const fa = eout(prog(t, T.phrase, T.phrase + 0.8));
  text('Sua ideia. Seus agentes. Tudo em uma conversa.', 960, 858 + (1 - fa) * 12, { size: 32, weight: 300, color: '#c9d0dc', align: 'center', alpha: fa });
  const ca = eout(prog(t, T.cta, T.cta + 0.7));
  if (ca > 0) {
    ctx.save(); ctx.globalAlpha = ca;
    const w = 280, x = 960 - w / 2, y = 892;
    rrect(ctx, x, y, w, 58, 29); ctx.fillStyle = 'rgba(255,255,255,0.06)'; ctx.fill(); ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.stroke();
    text('Conheça a Sora', 960, y + 37, { size: 21, weight: 600, color: '#f2f5fb', align: 'center' });
    borderBeam(x, y, w, 58, 29, t, { strength: 0.7, period: 3.0 });
    ctx.restore();
  }
}
function outroAgents(t) {
  const xs = [620, 960, 1300];
  AG.forEach((A, k) => {
    const u = eout(prog(t, T.agentsIn + k * 0.15, T.agentsIn + 1.1 + k * 0.15));
    if (u <= 0) return;
    const cx = lerp(960, xs[k], u), cy = lerp(320, 575, u), R = lerp(12, 62, u);
    floorGlow(cx, cy, R, A.col, u * 0.8);
    qBody({ cx, cy, R, col: A.col, type: A.type, rot: t * 0.35 + k * 2, seed: k, alpha: smooth(u * 2), lookX: (960 - xs[k]) / 600 * u, lookY: -0.6 * u, blinks: [72.6 + k * 0.3] });
    text(A.name, cx, cy + R + 50, { size: 17, weight: 600, color: A.hex, align: 'center', alpha: smooth(u * 2 - 0.8) });
  });
}

// ---------- fundo ----------
function background(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);
  const g = ctx.createRadialGradient(960, 480, 0, 960, 480, 1100);
  g.addColorStop(0, 'rgba(22,28,44,0.5)'); g.addColorStop(0.5, 'rgba(10,13,22,0.3)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 60; i++) {
    const x = (rand(i * 3.1) * W + t * (8 + rand(i) * 14)) % W, y = (rand(i * 5.7) * H - t * (4 + rand(i + 2) * 8) + H * 10) % H;
    ctx.fillStyle = `rgba(160,190,255,${0.07 + 0.12 * rand(i * 9.1) * (0.6 + 0.4 * Math.sin(t * 1.3 + i))})`;
    ctx.beginPath(); ctx.arc(x, y, 0.8 + rand(i * 1.3) * 1.2, 0, 7); ctx.fill();
  }
  ctx.restore();
}

// ---------- quadro ----------
function renderFrame(t) {
  BODIES = []; EYES = [];
  background(t);
  const M = mainState(t);
  // brilho no chão na abertura e no encerramento
  floorGlow(M.cx, M.cy, M.R, WHITE, smooth(prog(t, 1.5, 3.2)) * (1 - smooth(prog(t, 4.6, 5.6))) + smooth(prog(t, 68.6, 69.8)));
  drawDesktop(t);
  drawPhone(t);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
  outroAgents(t);
  // camada luminosa: Sora (partículas) + agentes
  lx.setTransform(1, 0, 0, 1, 0, 0); lx.clearRect(0, 0, W, H);
  lx.globalCompositeOperation = 'lighter';
  drawMainParticles(t, M);
  for (const B of BODIES) drawBodyDots(B, t);
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalCompositeOperation = 'lighter';
  ctx.filter = 'blur(14px)'; ctx.globalAlpha = 0.5; ctx.drawImage(layer, 0, 0);
  ctx.filter = 'blur(4px)'; ctx.globalAlpha = 0.55; ctx.drawImage(layer, 0, 0);
  ctx.filter = 'none'; ctx.globalAlpha = 1; ctx.drawImage(layer, 0, 0);
  ctx.restore();
  const eyeOpen = eback(prog(t, T.eyesOpen, T.eyesOpen + 0.45));
  drawEyes({ ...M, eyes: eyeOpen, alpha: smooth(prog(t, 0, 0.8)), blinks: [4.2, 9.5, 16.2, 23.0, 30.5, 36.0, 43.0, 51.0, 58.0, 66.4, 71.6] }, t);
  for (const B of EYES) drawEyes(B, t);
  drawCursor(t);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
  sceneTexts(t);
  const v = ctx.createRadialGradient(960, 540, 520, 960, 540, 1250);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.5)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  const fade = 1 - smooth(prog(t, 0, 0.6)) + smooth(prog(t, 74.4, 75));
  if (fade > 0) { ctx.fillStyle = `rgba(0,0,0,${clamp(fade)})`; ctx.fillRect(0, 0, W, H); }
}
window.renderFrame = renderFrame;

async function init() {
  try { await Promise.all([300, 400, 500, 600, 700].map(w => document.fonts.load(`${w} 40px Inter`)).concat([document.fonts.load('700 40px "Playfair Display"'), document.fonts.load('italic 500 40px "Playfair Display"')])); } catch (e) {}
  await loadImages();
  window.ready = true;
  const params = new URLSearchParams(location.search);
  if (params.has('render')) { document.body.classList.add('render'); return; }
  if (params.has('t')) { renderFrame(parseFloat(params.get('t'))); return; }
  let start = performance.now(), paused = false, pt = 0;
  addEventListener('keydown', e => {
    if (e.code === 'Space') { paused = !paused; if (!paused) start = performance.now() - pt * 1000; }
    if (e.code === 'ArrowRight') start -= 2000; if (e.code === 'ArrowLeft') start += 2000;
  });
  (function loop() { if (!paused) pt = ((performance.now() - start) / 1000) % DURATION; renderFrame(pt); requestAnimationFrame(loop); })();
}
init();
</script>
</body>
