# Instalador do app de desktop com atualização automática (app/docs/atualizacao-desktop.md).
#
# Roda quando alguém envia uma tag `desktop-v0.2.0` (ou pelo botão "Run workflow"). Gera o
# instalador do Windows, o arquivo .sig de cada um e o latest.json, e cria a versão no GitHub como
# RASCUNHO: os apps instalados só enxergam a versão nova depois que alguém publica o rascunho.
#
# Precisa dos segredos TAURI_SIGNING_PRIVATE_KEY e TAURI_SIGNING_PRIVATE_KEY_PASSWORD e da chave
# pública em app/src-tauri/tauri.conf.json (plugins.updater.pubkey). Sem eles o fluxo para no
# primeiro passo, com o motivo.
name: Desktop (versão)

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-versao-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Conferir chaves da atualização
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Falta o segredo TAURI_SIGNING_PRIVATE_KEY (veja app/docs/atualizacao-desktop.md)."
            exit 1
          fi
          node -e "
            const c = require('./app/src-tauri/tauri.conf.json');
            if (!(c.plugins && c.plugins.updater && c.plugins.updater.pubkey || '').trim()) {
              console.error('::error::Falta a chave pública em plugins.updater.pubkey do tauri.conf.json.');
              process.exit(1);
            }"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Instalar dependências do app
        working-directory: app
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: "Sora ${{ github.ref_name }}"
          releaseBody: "Versão do app de desktop. Publique este rascunho para os apps instalados receberem a atualização."
          releaseDraft: true
          includeUpdaterJson: true
          # gera os .sig e o latest.json só aqui (no PC, o build continua sem a chave privada)
          args: --config src-tauri/tauri.versao.conf.json
