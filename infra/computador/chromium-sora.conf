# Lido pelo /usr/bin/chromium do Debian. O contêiner já é o isolamento (sem capacidades, sem
# montar nada do host), por isso o sandbox interno do Chromium fica desligado.
export CHROMIUM_FLAGS="$CHROMIUM_FLAGS --no-sandbox --disable-dev-shm-usage --no-first-run \
 --no-default-browser-check --test-type --disable-breakpad --disable-crash-reporter --disable-quic \
 --password-store=basic --start-maximized --lang=pt-BR --user-data-dir=$HOME/.config/chromium \
 --proxy-server=${SORA_PROXY:-http://sora-proxy:3128} --proxy-bypass-list=<-loopback> \
 --force-webrtc-ip-handling-policy=disable_non_proxied_udp \
 --webrtc-ip-handling-policy=disable_non_proxied_udp"
